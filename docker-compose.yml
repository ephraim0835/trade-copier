services:
  api:
    image: ghcr.io/ephraim0835/trade-copier-api:latest
    container_name: trade-copier-api
    restart: always
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  web:
    image: ghcr.io/ephraim0835/trade-copier-web:latest
    container_name: trade-copier-web
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
