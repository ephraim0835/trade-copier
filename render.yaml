services:
  - type: web
    name: plaiz-markets-api
    env: node
    buildCommand: pnpm install -g pnpm@9.15.9 && pnpm install --prod=false && cd packages/database && pnpm exec prisma generate && pnpm exec prisma migrate deploy && cd ../.. && cd apps/api && pnpm run build
    startCommand: cd apps/api && pnpm run start
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: EA_TOKEN_SIGNING_SECRET
        sync: false
      - key: OWNER_INIT_SECRET
        sync: false
      - key: FRONTEND_URLS
        value: https://plaiz-markets.vercel.app
      - key: DEMO_ONLY
        value: "false"
      - key: LOG_LEVEL
        value: "warn"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 20.14.0
    plan: free
