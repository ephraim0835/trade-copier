services:
  - type: web
    name: plaiz-markets-api
    env: node
    buildCommand: npm install -g pnpm@9.15.9 && pnpm install --prod=false && cd packages/database && pnpm exec prisma generate && cd ../.. && cd apps/api && pnpm run build
    startCommand: cd apps/api && pnpm run start
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: EA_TOKEN_SIGNING_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://plaiz-markets.vercel.app
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 20.14.0
    plan: free
